tests:
  # ---------------------------------------------------------------- T1 Kampus

  - name: mahasiswa_angkatan_kosong
    topic: t1
    dimension: completeness
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_mahasiswa WHERE angkatan IS NULL OR angkatan = ''
    expected: fail
    perkiraan_baris: 62
    justifikasi: Slice tim dibentuk dari angkatan; baris tanpa angkatan tidak masuk tim mana pun.

  - name: presensi_duplikat_grain
    topic: t1
    dimension: uniqueness
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM (SELECT nim, kode_mk, tanggal FROM raw_presensi
      GROUP BY 1,2,3 HAVING count(*) > 1)
    expected: fail
    perkiraan_baris: 4344
    justifikasi: Grain fact presensi = satu mahasiswa per pertemuan per MK; baris kembar menggandakan kehadiran.

  - name: nilai_di_luar_rentang
    topic: t1
    dimension: validity
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_nilai
      WHERE TRY_CAST(nilai_angka AS INT) > 100 OR TRY_CAST(nilai_angka AS INT) < 0
    expected: fail
    perkiraan_baris: 2
    justifikasi: Nilai 117 dan -5 bukan nilai; keduanya merusak rata-rata per MK.

  - name: status_presensi_di_luar_domain
    topic: t1
    dimension: consistency
    severity: warning
    scope: source
    sql: >-
      SELECT count(*) FROM raw_presensi
      WHERE upper(trim(status)) NOT IN ('HADIR','H','IZIN','SAKIT','ALPA')
    expected: fail
    perkiraan_baris: 11819
    justifikasi: Status "-" pada ±10% baris bukan HADIR/IZIN/SAKIT/ALPA sehingga kehadiran sebenarnya tidak diketahui.

  - name: presensi_belum_diperbarui
    topic: t1
    dimension: timeliness
    severity: warning
    scope: source
    sql: >-
      SELECT CASE WHEN MAX(
        COALESCE(TRY_CAST(tanggal AS DATE), TRY_STRPTIME(tanggal, '%d/%m/%Y')::DATE)
      ) < current_date - INTERVAL '7' DAY THEN 1 ELSE 0 END
      FROM raw_presensi
    expected: fail
    perkiraan_baris: 1
    justifikasi: Data presensi terakhir sudah lewat lebih dari 7 hari, jadi rekap kehadiran yang dipakai untuk keputusan akademik sudah kedaluwarsa (flag biner 0/1, bukan jumlah baris).

  - name: nilai_huruf_tidak_konsisten_dengan_nilai_angka
    topic: t1
    dimension: accuracy
    severity: blocking
    scope: source
    sql: >-
      SELECT count(*) FROM raw_nilai
      WHERE (TRY_CAST(nilai_angka AS INT) >= 80 AND nilai_huruf NOT IN ('A','A-'))
         OR (TRY_CAST(nilai_angka AS INT) BETWEEN 60 AND 79 AND nilai_huruf NOT IN ('B','B+','B-'))
         OR (TRY_CAST(nilai_angka AS INT) < 60 AND nilai_huruf IN ('A','A-','B','B+','B-'))
    expected: fail
    perkiraan_baris: 6091
    justifikasi: Nilai huruf yang tidak sesuai konversi nilai angka berarti transkrip mahasiswa salah cetak.